    revertíveis removendo as linhas adicionadas.
  - These steps do not modify the system. Alias changes in $PROFILE must be
    reversible by removing the added lines.
- id: powershell-error-reading
  title:
  - "Como ler erros no PowerShell"
  - How to read PowerShell errors
  summary:
  - Usa os objetos de erro para identificar cmdlet, categoria e alvo.
  - Use error objects to identify the cmdlet, category and target.
  keywords:
  - erro
  - error
  - errorrecord
  - $error
  - exception
  - categoryinfo
  - erroraction
  steps:
  - instruction:
    - Consulta o último erro como objeto.
    - Inspect the last error as an object.
    interpretation:
    - "$Error[0] expõe CategoryInfo, Exception e TargetObject; a mensagem de texto perde este contexto. Um acesso limitado evita despejar o histórico inteiro."
    - "$Error[0] exposes CategoryInfo, Exception and TargetObject; the plain text message loses this context. A bounded read avoids dumping the whole history."
    command: ''
    probe_key: ''
  - instruction:
    - Trata erros não-terminantes de forma explícita.
    - Handle non-terminating errors explicitly.
    interpretation:
    - Por predefinição, cmdlets como Get-ChildItem continuam após erros por item e
      escrevem no fluxo de erro. -ErrorAction Stop converte em exceção capturável
      com try/catch.
    - By default cmdlets like Get-ChildItem continue after per-item errors and
      write to the error stream. -ErrorAction Stop converts them into an exception
      catchable with try/catch.
    command: ''
    probe_key: ''
  sources:
  - https://learn.microsoft.com/powershell/module/microsoft.powershell.core/about/about_try_catch_finally
  - https://learn.microsoft.com/powershell/module/microsoft.powershell.core/about/about_commonparameters

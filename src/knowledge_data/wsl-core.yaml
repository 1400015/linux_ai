facts:
- family: wsl
  display_name: Windows Subsystem for Linux
  wiki_name: Microsoft Learn WSL documentation
  wiki_url: https://learn.microsoft.com/windows/wsl/
  wiki_search_url: https://learn.microsoft.com/search/?search={query}&category=WSL
  docs_urls:
  - https://learn.microsoft.com/windows/wsl/
  - https://learn.microsoft.com/windows/wsl/wsl-config
  summary: Windows Subsystem for Linux runs real Linux distributions beside the
    Windows session, with per-distro configuration in /etc/wsl.conf and global
    options in .wslconfig.
  repositories: Each distro keeps its native package manager (apt, xbps); Windows
    applications come from winget.
  network: Default NAT mode gives the distro a private subnet; mirrored mode (Windows
    11 22H2+) shares the host interfaces. Port forwarding is configured on the host.
  logs: Distro-side logs are native Linux logs; wsl.exe itself logs through Windows
    Event Viewer and dmesg works inside the distro.
  hostname: The distro hostname defaults to the Windows computer name; /etc/wsl.conf
    can set it per distro.
  locale: Distro locales are native Linux locales; /etc/wsl.conf can control locale
    sharing with Windows.
  firewall_tool: Windows Defender Firewall governs the host; NAT'd distro traffic
    appears as host traffic.
  firewall_status:
  - - powershell
    - -Command
    - Get-NetFirewallProfile | Select-Object Name, Enabled
  firewall_allow: Windows-side netsh portproxy or New-NetFirewallRule (requires
    elevation and explicit confirmation)
  services_note: systemd can be enabled per distro with [boot] systemd=true in
    /etc/wsl.conf; otherwise service managers are unavailable inside WSL.
  distinct:
  - wsl.exe --list --verbose enumerates installed distributions and their states.
  - /etc/wsl.conf configures per-distro behaviour; .wslconfig sets global limits.
  - wsl.exe --update updates the WSL platform itself, not the distro packages.
  - Windows paths are reachable under /mnt/c; Linux paths from Windows via \\wsl$.
  - Interop can run Windows binaries from Linux; it is configurable per distro.
procedures:
- id: wsl-distro-not-starting
  title:
  - "Distribuição WSL não arranca"
  - WSL distribution does not start
  summary:
  - Verifica o estado da distribuição e da plataforma WSL antes de a reinstalar.
  - Check the distribution and WSL platform state before reinstalling it.
  keywords:
  - wsl
  - distro
  - distribuicao
  - distribuição
  - not starting
  - nao arranca
  - stuck
  steps:
  - instruction:
    - Lista as distribuições instaladas e o estado de cada uma.
    - List the installed distributions and their states.
    interpretation:
    - Usa wsl.exe --list --verbose. Um estado Stopped pode ser normal; Installing
      ou um nome ausente indica problemas de instalação ou registo da distribuição.
    - Use wsl.exe --list --verbose. A Stopped state can be normal; Installing or
      a missing name indicates installation or distribution registration problems.
    command: ''
    probe_key: ''
  - instruction:
    - Verifica a versão da plataforma WSL.
    - Check the WSL platform version.
    interpretation:
    - wsl.exe --version mostra a plataforma; uma versão desatualizada pode impedir
      distros novas de arrancarem. wsl.exe --update corrige a plataforma no host.
    - wsl.exe --version shows the platform; an outdated version can prevent new
      distros from starting. wsl.exe --update fixes the platform on the host.
    command: ''
    probe_key: ''
  sources:
  - https://learn.microsoft.com/windows/wsl/

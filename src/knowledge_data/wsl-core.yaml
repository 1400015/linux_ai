- id: wsl-network-unreachable
  title:
  - Rede indisponível dentro da WSL
  - Network unreachable inside WSL
  summary:
  - Distingue problemas do lado Linux dos limites do modo NAT do host.
  - Distinguish Linux-side problems from host NAT mode limits.
  keywords:
  - wsl
  - network
  - rede
  - nat
  - mirrored
  - dns
  - internet
  steps:
  - instruction:
    - Verifica a configuração IP dentro da distribuição.
    - Check the IP configuration inside the distribution.
    interpretation:
    - Em modo NAT, o endereço da distro é privado e o gateway é o host; sem endereço,
      o problema é do lado Linux. Em modo mirrored, a distro partilha as interfaces
      do host.
    - In NAT mode the distro address is private and the gateway is the host; without
      an address the problem is Linux-side. In mirrored mode the distro shares the
      host interfaces.
    command: ''
    probe_key: ''
  - instruction:
    - Confirma os servidores DNS da distribuição.
    - Confirm the distribution DNS servers.
    interpretation:
    - Em NAT, o WSL gera /etc/resolv.conf a partir do host; gerar stubs do Windows
      podem causar falhas de resolução. wsl.conf pode fixar nameservers dentro da distro.
    - In NAT, WSL generates /etc/resolv.conf from the host; Windows resolver stubs
      can cause resolution failures. wsl.conf can pin nameservers inside the distro.
    command: ''
    probe_key: ''
  sources:

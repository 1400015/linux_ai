- id: wsl-systemd-not-running
  title:
  - systemd não corre dentro da WSL
  - systemd does not run inside WSL
  summary:
  - Confirma se o systemd foi ativado na distribuição antes de investigar serviços.
  - Confirm whether systemd was enabled in the distribution before investigating services.
  keywords:
  - wsl
  - systemd
  - services
  - servicos
  - serviços
  - boot
  steps:
  - instruction:
    - Verifica se o systemd está ativado na configuração da distribuição.
    - Check whether systemd is enabled in the distribution configuration.
    interpretation:
    - O systemd exige [boot] systemd=true em /etc/wsl.conf e um reinício da distro
      (wsl.exe --terminate). Sem isto, systemctl não funciona por design.
    - systemd requires [boot] systemd=true in /etc/wsl.conf and a distro restart
      (wsl.exe --terminate). Without it, systemctl does not work by design.
    command: ''
    probe_key: ''
  - instruction:
    - Confirma a versão da plataforma WSL.
    - Confirm the WSL platform version.
    interpretation:
    - O systemd dentro do WSL exige uma plataforma recente; wsl.exe --version confirma
      a versão antes de ativar a configuração.
    - systemd inside WSL requires a recent platform; wsl.exe --version confirms the
      version before enabling the configuration.
    command: ''
    probe_key: ''
  sources:
  - https://learn.microsoft.com/windows/wsl/systemd

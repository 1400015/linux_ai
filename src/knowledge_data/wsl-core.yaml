- id: wsl-file-permissions
  title:
  - Permissões de ficheiros entre Windows e WSL
  - File permissions between Windows and WSL
  summary:
  - Compreende a tradução de permissões antes de a alterar.
  - Understand the permission translation before changing it.
  keywords:
  - wsl
  - permissions
  - permissoes
  - permissões
  - /mnt/c
  - metadata
  - chmod
  steps:
  - instruction:
    - Verifica se a montagem usa metadados de Linux.
    - Check whether the mount uses Linux metadata.
    interpretation:
    - Em /mnt/c sem a opção metadata, todos os ficheiros aparecem com permissões
      0777; isso não reflete as permissões reais do Windows nem é um erro.
    - On /mnt/c without the metadata option every file appears with 0777 permissions;
      that does not reflect real Windows permissions and is not an error.
    command: ''
    probe_key: ''
  - instruction:
    - Trabalha dentro do sistema de ficheiros da distro quando precisares de permissões
      reais de Linux.
    - Work inside the distro filesystem when you need real Linux permissions.
    interpretation:
    - Alterar chmod em /mnt/c pode criar entradas de metadados inconsistentes; os
      ficheiros da distro (por baixo de /) seguem semânticas nativas.
    - Changing chmod on /mnt/c can create inconsistent metadata entries; distro
      files (under /) follow native semantics.
    command: ''
    probe_key: ''
  sources:
  - https://learn.microsoft.com/windows/wsl/file-permissions

schema_version: '0.1'
id: windows-core
kind: platform
requires: []
match:
  distro_ids:
  - windows
  components: []
facts:
- family: windows
  display_name: Windows
  wiki_name: Microsoft Learn Windows documentation
  wiki_url: https://learn.microsoft.com/windows/
  wiki_search_url: https://learn.microsoft.com/search/?search={query}&category=Windows
  docs_urls:
  - https://learn.microsoft.com/windows/
  - https://learn.microsoft.com/windows/wsl/
  summary: Windows desktop and server operating system by Microsoft, with the winget
    package manager, PowerShell as the default shell and WSL for Linux workloads.
  repositories: Microsoft Store and winget community repository; additional sources
    can be added with winget source add.
  network: Settings app, Network Connections (ncpa.cpl), and Get-NetAdapter / Get-NetIPConfiguration
    in PowerShell.
  logs: Windows Event Viewer (eventvwr.msc); PowerShell via Get-WinEvent -LogName System
    with a bounded -MaxEvents value.
  hostname: Settings > System > About; PowerShell Rename-Computer requires a restart.
  locale: Settings > Time & language > Language & region.
  firewall_tool: Windows Defender Firewall with Advanced Security
  firewall_status:
  - - powershell
    - -Command
    - Get-NetFirewallProfile | Select-Object Name, Enabled
  firewall_allow: powershell -Command New-NetFirewallRule -DisplayName <name> -Direction
    Inbound -Action Allow (requires elevation and explicit confirmation)
  services_note: Services (services.msc) or Get-Service / Set-Service in PowerShell;
    service changes require an elevated session.
  distinct:
  - PowerShell is the default shell; cmdlets follow a Verb-Noun naming convention
    and many parameters use full words (-ListAvailable, -NoTypeInformation).
  - winget installs and upgrades applications from the command line.
  - WSL runs real Linux distributions beside the Windows session.
  - Execution policy, PSModulePath and $PROFILE shape how scripts behave per user
    and per host.
procedures:
- id: windows-service-fails
  title:
  - "Serviço do Windows não arranca"
  - Windows service fails to start
  summary:
  - Confirma o estado e a conta do serviço antes de o reiniciar.
  - Confirm the service state and account before restarting it.
  keywords:
  - servico
  - serviço
  - service
  - windows
  - failed
  - nao arranca
  - not starting
  steps:
  - instruction:
    - Consulta o estado do serviço identificado.
    - Inspect the identified service state.
    interpretation:
    - Usa Get-Service <nome> e distingue Stopped, Running e StartPending. Substitui
      o marcador por um nome confirmado.
    - Use Get-Service <name> and distinguish Stopped, Running and StartPending.
      Replace the placeholder with a confirmed name.
    command: ''
    probe_key: ''
  - instruction:
    - Consulta um trecho limitado dos eventos do Sistema relacionados com o serviço.
    - Inspect a bounded excerpt of System events related to the service.
    interpretation:
    - Usa Get-WinEvent -LogName System -MaxEvents 50 e procura a primeira causa,
      como dependências em falta ou falhas de permissões.
    - Use Get-WinEvent -LogName System -MaxEvents 50 and look for the first cause,
      such as missing dependencies or permission failures.
    command: ''
    probe_key: ''
  sources:
  - https://learn.microsoft.com/powershell/module/microsoft.powershell.management/get-service
  - https://learn.microsoft.com/powershell/module/microsoft.powershell.management/get-winevent

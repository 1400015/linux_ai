- id: windows-network-adapter
  title:
  - Adaptador de rede sem ligação no Windows
  - Windows network adapter disconnected
  summary:
  - Distingue adaptador desativado, cabo/Wi-Fi e configuração IP.
  - Distinguish a disabled adapter, cable/Wi-Fi and IP configuration.
  keywords:
  - rede
  - network
  - adaptador
  - adapter
  - ethernet
  - wifi
  - wi-fi
  - internet
  steps:
  - instruction:
    - Verifica os adaptadores de rede e o estado de cada um.
    - Check network adapters and their status.
    interpretation:
    - Usa Get-NetAdapter e distingue Disabled, Disconnected e Up. Um adaptador Disabled
      exige ativação; Disconnected indica cabo ou rádio, não configuração.
    - Use Get-NetAdapter and distinguish Disabled, Disconnected and Up. A Disabled
      adapter must be enabled; Disconnected points to cable or radio, not configuration.
    command: ''
    probe_key: ''
  - instruction:
    - Confirma a configuração IP do adaptador em uso.
    - Confirm the IP configuration of the adapter in use.
    interpretation:
    - Usa Get-NetIPConfiguration e verifica endereço, gateway e servidores DNS. Um
      endereço 169.254.x.x indica falha DHCP na rede local.
    - Use Get-NetIPConfiguration and check address, gateway and DNS servers. A
      169.254.x.x address indicates local DHCP failure.
    command: ''
    probe_key: ''
  sources:
  - https://learn.microsoft.com/powershell/module/netadapter/get-netadapter
  - https://learn.microsoft.com/powershell/module/nettcpip/get-netipconfiguration

- id: windows-event-log-errors
  title:
  - "Erros no registo de eventos do Windows"
  - Windows Event Log errors
  summary:
  - Identifica eventos de erro recentes antes de alterar configuração.
  - Identify recent error events before changing configuration.
  keywords:
  - eventos
  - events
  - event viewer
  - eventvwr
  - log
  - erro
  - error
  steps:
  - instruction:
    - Consulta um número limitado de eventos recentes do Sistema.
    - Inspect a limited number of recent System events.
    interpretation:
    - Usa Get-WinEvent -LogName System -MaxEvents 50. Filtra por Level para erros;
      o eventId e o provider identificam o componente responsável.
    - Use Get-WinEvent -LogName System -MaxEvents 50. Filter by Level for errors;
      the eventId and provider identify the responsible component.
    command: ''
    probe_key: ''
  - instruction:
    - Compara o evento com a documentação do provider antes de agir.
    - Compare the event with the provider documentation before acting.
    interpretation:
    - Um evento de erro isolado pode ser transitório. Procura padrões repetidos no
      mesmo provider e evita alterar configuração com base num único evento.
    - A single error event may be transient. Look for repeated patterns on the
      same provider and avoid changing configuration based on one event.
    command: ''
    probe_key: ''
  sources:
  - https://learn.microsoft.com/powershell/module/microsoft.powershell.management/get-winevent
  - https://learn.microsoft.com/windows/win32/wes/windows-event-log

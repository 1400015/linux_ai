- id: windows-update-issue
  title:
  - Problemas com o Windows Update
  - Windows Update problems
  summary:
  - Verifica o estado do serviço e do histórico antes de aplicar correções.
  - Check the service state and history before applying fixes.
  keywords:
  - update
  - atualizacao
  - atualização
  - windows update
  - patches
  steps:
  - instruction:
    - Verifica o estado do serviço Windows Update.
    - Check the Windows Update service state.
    interpretation:
    - Usa Get-Service wuauserv. O serviço pode estar Stopped por política ou por
      escolha; não significa necessariamente corrupção.
    - Use Get-Service wuauserv. The service may be Stopped due to policy or by
      choice; it does not necessarily mean corruption.
    command: ''
    probe_key: ''
  - instruction:
    - Verifica o histórico de atualizações instaladas.
    - Check the history of installed updates.
    interpretation:
    - Usa as Definições ou Get-HotFix para listar atualizações instaladas e comparar
      com a esperada. Falhas repetidas no mesmo update sugerem corrupção de componentes.
    - Use Settings or Get-HotFix to list installed updates and compare with the
      expected one. Repeated failures on the same update suggest component corruption.
    command: ''
    probe_key: ''
  sources:
  - https://learn.microsoft.com/windows/deployment/update/

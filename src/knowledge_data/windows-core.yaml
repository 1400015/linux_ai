- id: windows-disk-space
  title:
  - "Disco cheio no Windows"
  - Windows disk full
  summary:
  - Localiza a unidade sem espaço antes de apagar dados.
  - Locate the drive without space before deleting data.
  keywords:
  - disco
  - disk
  - space
  - storage
  - volume
  - cheio
  - full
  steps:
  - instruction:
    - Verifica a ocupação das unidades.
    - Check drive usage.
    interpretation:
    - Usa Get-Volume e compara SizeRemaining com Size. Uma percentagem elevada exige
      identificar a unidade afetada, incluindo unidades de rede montadas.
    - Use Get-Volume and compare SizeRemaining with Size. High usage requires
      identifying the affected drive, including mounted network drives.
    command: ''
    probe_key: ''
  - instruction:
    - Usa a Ferramenta de Limpeza de Disco ou Definições para limpar ficheiros temporários.
    - Use Disk Cleanup or Settings to clean temporary files.
    interpretation:
    - Confirma os itens a eliminar antes de avançar. Limpezas automáticas podem remover
      ficheiros ainda necessários, como descarregamentos ou versões anteriores do
      Windows.
    - Confirm the items to remove before proceeding. Automatic cleanup may delete
      files still needed, such as downloads or previous Windows versions.
    command: ''
    probe_key: ''
  sources:
  - https://learn.microsoft.com/powershell/module/storage/get-volume

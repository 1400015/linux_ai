procedures:
- id: apt-lock
  title:
  - APT bloqueado por outra operação
  - APT locked by another operation
  summary:
  - Verifica operações em curso antes de intervir.
  - Check running operations before intervening.
  keywords:
  - apt
  - lock
  - bloqueio
  - dpkg
  - another process
  - outro processo
  steps:
  - instruction:
    - Confirma se existe outra operação de pacotes em curso.
    - Check whether another package operation is running.
    interpretation:
    - Atualizações automáticas também podem usar APT. Aguarda uma operação legítima;
      não apagues ficheiros de lock como primeiro passo.
    - Automatic updates can also use APT. Wait for a legitimate operation; do not
      delete lock files as a first step.
    command: ps aux
    probe_key: ''
  - instruction:
    - Se uma operação terminou com erro, guarda a mensagem completa.
    - If an operation ended with an error, preserve the full message.
    interpretation:
    - A recuperação depende da causa e pode alterar pacotes. Confirma o plano antes
      de reparar.
    - Recovery depends on the cause and may modify packages. Confirm the plan before
      repairing.
    command: ''
    probe_key: ''
  sources:
  - https://wiki.debian.org/Teams/Dpkg/FAQ
  families:
  - debian
  - ubuntu
  - mint
  component: apt
  versions: []
  reviewed_at: '2026-10-02'
  verification: documentation_review
  tested_versions: []
  version_scope:
  - Orientação por componente; confirma diferenças da versão instalada antes de corrigir.
  - Component-based guidance; confirm installed-release differences before fixing.
  effects: read_only_guidance
  recovery:
  - Estes passos não alteram o sistema. Antes de corrigir, guarda a configuração e
    define como repor a alteração.
  - These steps do not modify the system. Before fixing it, save the configuration
    and define how to revert the change.
- id: apt-dependencies
  title:
  - Dependências APT inconsistentes
  - Inconsistent APT dependencies
  summary:
  - Recolhe a mensagem e verifica o estado antes de reparar.
  - Collect the message and inspect state before repairing.
  keywords:
  - apt
  - dependencia
  - dependência
  - dependency
  - dependencies
  - broken
  - unmet
  steps:
  - instruction:
    - Guarda os nomes e versões mencionados no erro.
    - Preserve names and versions mentioned in the error.
    interpretation:
    - Verifica se há pacotes retidos ou repositórios de versões diferentes.
    - Check for held packages or repositories from different releases.
    command: apt-mark showhold
    probe_key: ''
  - instruction:
    - Avalia uma simulação de reparação antes de confirmar alterações.
    - Evaluate a repair simulation before confirming changes.
    interpretation:
    - apt-get -s -f install mostra um plano. Revê remoções e não assumes que todas
      são desejadas.
    - apt-get -s -f install shows a plan. Review removals and do not assume all are
      intended.
    command: apt-get -s -f install
    probe_key: ''
  sources:

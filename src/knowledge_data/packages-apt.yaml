- id: apt-interrupted
  title:
  - Configuração dpkg interrompida
  - Interrupted dpkg configuration
  summary:
  - Identifica pacotes incompletos e a primeira falha de configuração.
  - Identify incomplete packages and the first configuration failure.
  keywords:
  - dpkg was interrupted
  - dpkg
  - half-configured
  - half-installed
  - interrompido
  steps:
  - instruction:
    - Inspeciona o estado da base de pacotes.
    - Inspect package database state.
    interpretation:
    - dpkg --audit identifica pacotes parcialmente instalados. Confirma que não existe
      outra transação ativa.
    - dpkg --audit identifies partially installed packages. Confirm that no other
      transaction is active.
    command: dpkg --audit
    probe_key: ''
  - instruction:
    - Lê a primeira falha e verifica espaço e dependências.
    - Read the first failure and check space and dependencies.
    interpretation:
    - dpkg --configure -a altera o sistema e executa scripts; só o uses numa recuperação
      aprovada. Não elimines a base de dados ou locks.
    - dpkg --configure -a modifies the system and runs scripts; use it only in an
      approved recovery. Do not delete the database or locks.
    command: ''
    probe_key: ''

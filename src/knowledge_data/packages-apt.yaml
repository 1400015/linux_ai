- id: apt-repositories
  title:
  - Erro nos repositórios APT
  - APT repository error
  summary:
  - Distingue falha de rede, assinatura e versão de distribuição.
  - Distinguish network, signature and distribution-release failures.
  keywords:
  - apt
  - repository
  - repositories
  - repositorio
  - repositório
  - sources.list
  - '404'
  - signature
  steps:
  - instruction:
    - Identifica a origem e a mensagem exata.
    - Identify the source and exact message.
    interpretation:
    - A configuração pode estar em sources.list ou sources.list.d, incluindo ficheiros
      .sources. Confirma a versão em os-release.
    - Configuration may be in sources.list or sources.list.d, including .sources files.
      Confirm the release in os-release.
    command: ''
    probe_key: ''
  - instruction:
    - Confirma a origem oficial antes de editar.
    - Confirm the official source before editing.
    interpretation:
    - Não desatives verificação de assinaturas para contornar o erro. Guarda a configuração
      anterior e verifica o resultado.
    - Do not disable signature verification to bypass the error. Save previous configuration
      and verify the result.
    command: ''
    probe_key: ''

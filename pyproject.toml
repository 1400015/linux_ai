[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-ai-assistant"
# Versão única: lida de src/_version.py (sem importar o pacote — setuptools
# lê o literal por AST); antes estava espalhada por 5+ ficheiros.
dynamic = ["version"]
description = "Assistente de IA permanente para Linux com interface flutuante"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Linux AI Assistant Team" }]
keywords = ["linux", "ai", "gtk", "assistant", "desktop"]

dependencies = [
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.5",
    "tenacity>=8.2.3",
    "notify2>=0.3.1",
    "PyYAML>=6.0.3,<7",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
# OCR wrapper. `extract_text_from_image` degrada para o binário `tesseract`
# do sistema quando ausente, por isso não é dependência obrigatória.
ocr = ["pytesseract>=0.3.10"]
# Encriptação de API keys em config.json (app.encryption_enabled)
encryption = ["cryptography>=42.0.2"]
# Optional desktop keyring support; importing the client must not require it.
secret-service = ["secretstorage>=3.3,<4"]
dev = [
    "ruff>=0.5",
    "mypy==2.4.0; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/1400015/linux_ai"
Source = "https://github.com/1400015/linux_ai"
"Bug Reports" = "https://github.com/1400015/linux_ai/issues"

[project.scripts]
linux-ai-assistant = "src.app:main"
# Headless front end (chat, sessions, knowledge, diagnose, ...); the GUI entry
# point above requires GTK, this one must not.
linux-ai-assistant-cli = "src.cli:main"

[tool.setuptools]
packages = ["src", "plugins"]

[tool.setuptools.package-data]
src = ["knowledge_data/*.yaml", "knowledge_data/schema/*.json"]

[tool.setuptools.dynamic]
version = { attr = "src._version.__version__" }

# themes/ is not a Python package (no __init__.py), so its JSON files are
# shipped as data files; ConfigManager falls back to
# <sys.prefix>/share/linux-ai-assistant/themes when the source tree is absent.
[tool.setuptools.data-files]
"share/linux-ai-assistant/themes" = ["themes/*.json"]
"share/applications" = ["scripts/linux-ai-assistant.desktop"]
"share/icons/hicolor/scalable/apps" = ["assets/io.github.linux_ai_assistant.svg"]

[tool.ruff]
line-length = 110
target-version = "py38"

[tool.ruff.lint]
# E/F/W é o mínimo histórico; B (bugbear), G (formato de logging) e RUF013
# entraram depois de as ocorrências existentes serem corrigidas, para o gate
# não ser só cosmético:
#   - B023 (closures sobre variáveis de loop) dava testes falsamente verdes;
#   - B904 (raise sem causa) perdia o erro original nos skips dos testes;
#   - G004 obrigou interpolação preguiçosa nos logger;
#   - RUF013 obriga a Optional[...] explícito nas assinaturas.
# E501/E722 continuam desligados de propósito (ficha do projecto).
select = ["E", "F", "W", "B", "G", "RUF013"]
ignore = [
    "E501",   # linhas longas
    "E722",   # except: vazio intencional em fallbacks
    "E741",
    "E402",   # imports após gi.require_version()/sys.path hacks (padrão GTK/testes)
]

# Sem per-file-ignores: os imports condicionais de GTK em app.py e em
# main_window.py já passam F401 isolado, por isso o gate aplica-se igual a
# todos os ficheiros.

[tool.mypy]
# A gradual gate, not a claim that the entire application is fully typed.
# Mypy 2.4 requires Python >=3.10; the runtime's >=3.8 compatibility remains
# covered by the existing test matrix. This analysis uses the CI's Python 3.12.
python_version = "3.12"
platform = "linux"
files = [
    "src/render_core.py",
    "src/build_info.py",
    "src/system_context.py",
    "src/credential_store.py",
    "src/command_policy.py",
    "src/bounded_http.py",
    "src/history_store.py",
    "src/ai_client.py",
    "src/safe_paths.py",
    "src/chat_controller.py",
    "src/theme_style.py",
    "src/error_presenter.py",
    "src/stats_aggregator.py",
    "src/a11y.py",
    "src/pomodoro.py",
]
# Read the types of imported modules without gating their existing diagnostics.
# Only the explicitly selected sources above belong to this first increment.
follow_imports = "silent"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # requires-python é ">=3.8": o CI tem de honrar a matriz completa.
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Sem isto os testes falham no runner limpo: test_offline/test_regressions
        # importam src.ai_client (tenacity, requests) e test_installation importa
        # src.config_manager (python-dotenv, psutil).
        run: python3 -m pip install -r requirements.txt

      - name: Byte-compile all sources
        run: python3 -m py_compile src/*.py tests/*.py plugins/*.py

      - name: Run test suite
        run: python3 -m unittest discover -s tests -v

      - name: Lint (ruff)
        # Falhável: o lint anterior (pyflakes com continue-on-error) nunca
        # conseguia quebrar o build. O projeto já define [tool.ruff] no pyproject.
        run: |
          python3 -m pip install ruff
          python3 -m ruff check src/ tests/ plugins/

      - name: Shellcheck installers
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh run.sh

  gtk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gtk-3.0 python3-requests python3-dotenv python3-tenacity python3-psutil xvfb
      - name: Test real GTK buffers, streaming, sessions and provider settings
        run: |
          xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -p 'test_gui_stream.py' -v
          xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -p 'test_feature_interfaces.py' -v
          xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -p 'test_phase_two.py' -v
      - name: Test GTK trial, device, Wayland and conversational dialogs
        run: |
          xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -p 'test_trial_dialog.py' -v
          xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -p 'test_device_dialog_regressions.py' -v
          xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -p 'test_wayland_feature_fixes.py' -v
          xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -p 'test_conversational_interfaces.py' -v

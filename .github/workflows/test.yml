name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # requires-python é ">=3.8": o CI tem de honrar a matriz completa.
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Sem isto os testes falham no runner limpo: test_offline/test_regressions
        # importam src.ai_client (tenacity, requests) e test_installation importa
        # src.config_manager (python-dotenv, psutil).
        run: python3 -m pip install -r requirements.txt

      - name: Byte-compile all sources
        run: python3 -m py_compile src/*.py tests/*.py plugins/*.py scripts/run_gtk_tests.py

      - name: Run test suite
        run: python3 -m unittest discover -s tests -v

      - name: Lint (ruff)
        # Falhável: o lint anterior (pyflakes com continue-on-error) nunca
        # conseguia quebrar o build. O projeto já define [tool.ruff] no pyproject.
        run: |
          python3 -m pip install ruff
          python3 -m ruff check src/ tests/ plugins/ scripts/run_gtk_tests.py

      - name: Shellcheck installers
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh run.sh

  gtk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gtk-3.0 python3-venv xvfb
          /usr/bin/python3 -m venv --system-site-packages .venv-gtk
          .venv-gtk/bin/python -m pip install -r requirements.txt
      - name: Test the complete suite with GTK and reject unexpected skips
        run: |
          xvfb-run -a .venv-gtk/bin/python scripts/run_gtk_tests.py

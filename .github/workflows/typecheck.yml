name: Type checking

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install ".[dev]"
      - name: Check the selected core modules
        # The exact module list and pinned analyzer live in pyproject.toml.
        run: python -m mypy --config-file pyproject.toml
